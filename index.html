<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DRH LUDO</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 padding:12px;
 background:#171717;
 color:#fff;
 font-family:Arial,sans-serif;
 text-align:center
}
h1{color:#ffd700;margin:5px}
#status{min-height:24px;color:#00ff88;font-weight:bold}

.board{
 width:min(96vw,600px);
 aspect-ratio:1;
 margin:15px auto;
 display:grid;
 grid-template-columns:repeat(15,1fr);
 grid-template-rows:repeat(15,1fr);
 border:5px solid #111;
 background:#fff;
}

.cell{
 position:relative;
 border:1px solid #777;
 display:flex;
 align-items:center;
 justify-content:center;
}

/* FOUR HOMES */

.redHome{background:#ef5350}
.greenHome{background:#66bb6a}
.yellowHome{background:#ffee58}
.blueHome{background:#42a5f5}

/* HOME INNER */

.homeInner{
 width:82%;
 height:82%;
 background:white;
 border:3px solid #222;
 border-radius:12px;
 display:grid;
 grid-template-columns:1fr 1fr;
 grid-template-rows:1fr 1fr;
 gap:5px;
 padding:6px;
}

.redHome .homeInner{background:#ffb0b0}
.greenHome .homeInner{background:#b8f0b8}
.yellowHome .homeInner{background:#fff9a8}
.blueHome .homeInner{background:#a9dcff}

/* PATH COLORS */

.redPath{background:#ff8a8a}
.greenPath{background:#91df91}
.yellowPath{background:#fff58a}
.bluePath{background:#8bcfff}

.commonPath{background:#fff}

/* START CELLS */

.redStart{background:#e00000!important}
.greenStart{background:#00a000!important}
.yellowStart{background:#e0b800!important}
.blueStart{background:#0066dd!important}

/* SAFE */

.safe:after{
 content:"★";
 color:#333;
 font-size:14px;
 position:absolute;
}

/* CENTER */

.center{
 background:
 linear-gradient(45deg,
 #e00000 0 25%,
 #00a000 25% 50%,
 #e0b800 50% 75%,
 #0066dd 75%);
}

/* TOKENS */

.token{
 width:72%;
 height:72%;
 border-radius:50%;
 border:3px solid white;
 box-shadow:
 0 3px 5px #222,
 inset 0 2px 3px rgba(255,255,255,.6);
 z-index:10;
 cursor:pointer;
}

.token.red{background:#d00000}
.token.green{background:#008f00}
.token.yellow{background:#e5b900}
.token.blue{background:#005dcc}

.selectable{
 animation:pulse .6s infinite alternate;
}

@keyframes pulse{
 from{transform:scale(.82)}
 to{transform:scale(1.12)}
}

/* DICE */

.dice{
 width:85px;
 height:85px;
 margin:8px auto;
 background:white;
 border-radius:15px;
 padding:10px;
 display:grid;
 grid-template-columns:repeat(3,1fr);
 grid-template-rows:repeat(3,1fr);
 box-shadow:0 5px 15px #000;
}

.dot{
 width:17px;
 height:17px;
 background:#111;
 border-radius:50%;
 align-self:center;
 justify-self:center;
}

.rolling{
 animation:roll .7s ease-in-out;
}

@keyframes roll{
 0%{transform:rotate(0) scale(1)}
 25%{transform:rotate(90deg) scale(1.1)}
 50%{transform:rotate(180deg) scale(1.15)}
 75%{transform:rotate(270deg) scale(1.1)}
 100%{transform:rotate(360deg) scale(1)}
}

button{
 padding:12px 25px;
 margin:5px;
 border:0;
 border-radius:10px;
 background:#ff9800;
 color:#fff;
 font-size:17px;
 font-weight:bold;
 cursor:pointer;
}
button:disabled{opacity:.5}
</style>
</head>

<body>

<h1>🎲 DRH LUDO</h1>

<div>Turn: <b id="turn">You 🔴</b></div>
<div id="status">Roll the dice to start!</div>

<div id="dice" class="dice"></div>

<div>Dice: <b id="number">-</b></div>

<button id="rollBtn" onclick="rollDice()">Roll Dice</button>

<div id="board" class="board"></div>

<script>

/* 52 COMMON PATH CELLS */

const path=[
[6,1],[6,2],[6,3],[6,4],[6,5],
[5,6],[4,6],[3,6],[2,6],[1,6],[0,6],
[0,7],[0,8],
[1,8],[2,8],[3,8],[4,8],[5,8],
[6,9],[6,10],[6,11],[6,12],[6,13],[6,14],
[7,14],[8,14],
[8,13],[8,12],[8,11],[8,10],[8,9],
[9,8],[10,8],[11,8],[12,8],[13,8],[14,8],
[14,7],[14,6],
[13,6],[12,6],[11,6],[10,6],[9,6],
[8,5],[8,4],[8,3],[8,2],[8,1],[8,0],
[7,0],[6,0]
];

/* HOME POSITIONS - 4 TOKENS 2x2 */

const home={
 red:[[1,1],[1,3],[3,1],[3,3]],
 green:[[1,11],[1,13],[3,11],[3,13]],
 yellow:[[11,1],[11,3],[13,1],[13,3]],
 blue:[[11,11],[11,13],[13,11],[13,13]]
};

/* START POSITIONS */

const start={
 red:0,
 green:13,
 yellow:26,
 blue:39
};

/* COLOR SECTIONS */

function pathColor(i){

 if(i>=0 && i<=12)return "redPath";
 if(i>=13 && i<=25)return "greenPath";
 if(i>=26 && i<=38)return "yellowPath";
 return "bluePath";
}

/* SAFE CELLS */

const safe=[0,8,13,21,26,34,39,47];

const colors=["red","green","yellow","blue"];

let tokens={
 red:[-1,-1,-1,-1],
 green:[-1,-1,-1,-1],
 yellow:[-1,-1,-1,-1],
 blue:[-1,-1,-1,-1]
};

let turn="red";
let dice=0;
let gameOver=false;


/* CREATE BOARD */

function createBoard(){

 const board=document.getElementById("board");

 board.innerHTML="";

 for(let r=0;r<15;r++){

  for(let c=0;c<15;c++){

   const cell=document.createElement("div");

   cell.className="cell";

   /* HOME AREAS */

   if(r<6 && c<6){
    cell.classList.add("redHome");
   }

   else if(r<6 && c>8){
    cell.classList.add("greenHome");
   }

   else if(r>8 && c<6){
    cell.classList.add("yellowHome");
   }

   else if(r>8 && c>8){
    cell.classList.add("blueHome");
   }

   /* COMMON PATH */

   const index=path.findIndex(
    p=>p[0]===r && p[1]===c
   );

   if(index>=0){

    cell.className="cell";

    cell.classList.add(pathColor(index));

    if(safe.includes(index)){
     cell.classList.add("safe");
    }

    if(index===0)
     cell.classList.add("redStart");

    if(index===13)
     cell.classList.add("greenStart");

    if(index===26)
     cell.classList.add("yellowStart");

    if(index===39)
     cell.classList.add("blueStart");
   }

   /* CENTER */

   if(r>=6 && r<=8 && c>=6 && c<=8){
    cell.className="cell center";
   }

   cell.id=`cell-${r}-${c}`;

   board.appendChild(cell);
  }
 }

 render();
}


/* RENDER TOKENS */

function render(){

 document.querySelectorAll(".token")
 .forEach(x=>x.remove());

 colors.forEach(color=>{

  tokens[color].forEach((pos,i)=>{

   let cell;

   /* HOME */

   if(pos===-1){

    const p=home[color][i];

    cell=document.getElementById(
     `cell-${p[0]}-${p[1]}`
    );

   }

   /* PATH */

   else{

    const index=
     (start[color]+pos)%52;

    const p=path[index];

    cell=document.getElementById(
     `cell-${p[0]}-${p[1]}`
    );
   }

   if(cell){

    const token=document.createElement("div");

    token.className=`token ${color}`;

    if(color==="red" && turn==="red"){
     token.onclick=()=>selectToken(i);
    }

    cell.appendChild(token);
   }

  });

 });
}


/* DICE */

function showDice(n){

 const d=document.getElementById("dice");

 d.innerHTML="";

 const map={
 1:[5],
 2:[1,9],
 3:[1,5,9],
 4:[1,3,7,9],
 5:[1,3,5,7,9],
 6:[1,3,4,6,7,9]
 };

 map[n].forEach(pos=>{

  const dot=document.createElement("div");

  dot.className="dot";

  dot.style.gridRow=
   Math.ceil(pos/3);

  dot.style.gridColumn=
   ((pos-1)%3)+1;

  d.appendChild(dot);

 });
}


/* ROLL */

function rollDice(){

 if(gameOver)return;

 if(turn!=="red")return;

 document.getElementById("rollBtn").disabled=true;

 const d=document.getElementById("dice");

 d.classList.remove("rolling");

 void d.offsetWidth;

 d.classList.add("rolling");

 dice=Math.floor(Math.random()*6)+1;

 document.getElementById("number").innerText=dice;

 setTimeout(()=>{

  showDice(dice);

  document.getElementById("status").innerText=
   dice===6
   ?"6 आया! लाल गोटी चुनें."
   :"अपनी चलने वाली गोटी चुनें.";

  highlight();

 },700);
}


/* HIGHLIGHT MOVABLE TOKENS */

function highlight(){

 document.querySelectorAll(".token.red")
 .forEach(x=>x.classList.remove("selectable"));

 tokens.red.forEach((pos,i)=>{

  if(canMove("red",i)){

   const list=
    document.querySelectorAll(".token.red");

   if(list[i])
    list[i].classList.add("selectable");
  }
 });
}


/* CAN MOVE */

function canMove(color,i){

 const pos=tokens[color][i];

 if(pos===56)return false;

 if(pos===-1)
  return dice===6;

 return pos+dice<=56;
}


/* PLAYER SELECT */

function selectToken(i){

 if(turn!=="red")return;

 if(!canMove("red",i)){

  document.getElementById("status").innerText=
   "इस गोटी को अभी नहीं चला सकते।";

  return;
 }

 moveToken("red",i,dice);
}


/* MOVE */

function moveToken(color,i,steps){

 let pos=tokens[color][i];

 if(pos===-1)
  pos=0;
 else
  pos+=steps;

 tokens[color][i]=pos;

 capture(color,i);

 render();

 if(checkWin(color)){

  gameOver=true;

  document.getElementById("status").innerText=
   color==="red"
   ?"🏆 आप जीत गए!"
   :"🤖 Computer जीत गया!";

  return;
 }

 /* 6 = EXTRA TURN */

 if(steps===6){

  if(color==="red"){

   turn="red";

   document.getElementById("turn").innerText=
    "You 🔴";

   document.getElementById("status").innerText=
    "6 आया! फिर से Dice Roll करें.";

   document.getElementById("rollBtn").disabled=false;

  }else{

   setTimeout(computerTurn,800);

  }

  return;
 }

 /* COMPUTER */

 if(color==="red"){

  turn="green";

  document.getElementById("turn").innerText=
   "Computer 🟢";

  document.getElementById("status").innerText=
   "Computer की बारी...";

  setTimeout(computerTurn,1000);

 }

 /* PLAYER */

 else{

  turn="red";

  document.getElementById("turn").innerText=
   "You 🔴";

  document.getElementById("status").innerText=
   "आपकी बारी! Dice Roll करें.";

  document.getElementById("rollBtn").disabled=false;
 }
}


/* CAPTURE */

function capture(color,i){

 const pos=tokens[color][i];

 if(pos<0)return;

 const current=
  (start[color]+pos)%52;

 if(safe.includes(current))
  return;

 colors.forEach(other=>{

  if(other===color)return;

  tokens[other].forEach((p,j)=>{

   if(p<0)return;

   const otherPos=
    (start[other]+p)%52;

   if(otherPos===current){

    tokens[other][j]=-1;
   }

  });
 });
}


/* WIN */

function checkWin(color){

 return tokens[color]
 .every(p=>p===56);
}


/* COMPUTER */

function computerTurn(){

 if(gameOver)return;

 turn="green";

 dice=
  Math.floor(Math.random()*6)+1;

 document.getElementById("number").innerText=dice;

 showDice(dice);

 document.getElementById("status").innerText=
  "Computer ने "+dice+" roll किया.";

 /* FIND MOVABLE TOKEN */

 let possible=[];

 tokens.green.forEach((pos,i)=>{

  if(canMove("green",i)){
   possible.push(i);
  }
 });

 /* NO MOVE */

 if(possible.length===0){

  if(dice===6){

   setTimeout(()=>{

    document.getElementById("status").innerText=
     "Computer को 6 मिला, लेकिन गोटी नहीं चल सकी.";

    setTimeout(computerTurn,700);

   },500);

  }else{

   setTimeout(()=>{

    turn="red";

    document.getElementById("turn").innerText=
     "You 🔴";

    document.getElementById("status").innerText=
     "आपकी बारी! Dice Roll करें.";

    document.getElementById("rollBtn").disabled=false;

   },700);
  }

  return;
 }

 /* COMPUTER CHOOSES TOKEN */

 const chosen=
  possible[
   Math.floor(Math.random()*possible.length)
  ];

 setTimeout(()=>{

  moveToken("green",chosen,dice);

 },800);
}


/* START */

createBoard();

showDice(1);

</script>

</body>
</html>
