<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>DRH LUDO</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  padding:15px;
  background:#151515;
  color:#fff;
  font-family:Arial,sans-serif;
  text-align:center
}
h1{color:#ffd700;margin:5px}
#status{min-height:25px;margin:8px;font-weight:bold;color:#00ff88}
.board{
  width:min(96vw,600px);
  aspect-ratio:1;
  margin:15px auto;
  display:grid;
  grid-template-columns:repeat(15,1fr);
  grid-template-rows:repeat(15,1fr);
  border:4px solid #111;
  background:#fff
}
.cell{
  position:relative;
  border:1px solid #999;
  display:flex;
  align-items:center;
  justify-content:center
}

/* HOME AREAS */
.redHome{background:#ef5350}
.greenHome{background:#66bb6a}
.yellowHome{background:#ffee58}
.blueHome{background:#42a5f5}

/* PATH */
.path{background:#fff}

/* START CELLS */
.redStart{background:#ef5350!important}
.greenStart{background:#66bb6a!important}
.yellowStart{background:#ffee58!important}
.blueStart{background:#42a5f5!important}

/* SAFE */
.safe:after{
  content:"★";
  color:#555;
  font-size:16px
}

/* CENTER */
.center{
  background:
  linear-gradient(45deg,
  #ef5350 0 25%,
  #66bb6a 25% 50%,
  #ffee58 50% 75%,
  #42a5f5 75%)
}

/* TOKENS */
.token{
  width:75%;
  height:75%;
  border-radius:50%;
  border:3px solid #fff;
  box-shadow:0 3px 6px #222;
  z-index:5;
  cursor:pointer
}
.red{background:#d50000}
.green{background:#00a000}
.yellow{background:#f5c400}
.blue{background:#0066dd}

.selected{
  animation:pulse .6s infinite alternate
}
@keyframes pulse{
  from{transform:scale(.85)}
  to{transform:scale(1.15)}
}

/* DICE */
.dice{
  width:85px;
  height:85px;
  margin:10px auto;
  background:#fff;
  border-radius:15px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  grid-template-rows:repeat(3,1fr);
  padding:10px;
  box-shadow:0 5px 15px #000
}
.dot{
  width:17px;
  height:17px;
  background:#111;
  border-radius:50%;
  align-self:center;
  justify-self:center
}
.rolling{animation:roll .7s}
@keyframes roll{
  0%{transform:rotate(0)}
  25%{transform:rotate(90deg) scale(1.1)}
  50%{transform:rotate(180deg)}
  75%{transform:rotate(270deg) scale(1.1)}
  100%{transform:rotate(360deg)}
}

button{
  padding:12px 25px;
  margin:6px;
  border:0;
  border-radius:10px;
  background:#ff9800;
  color:#fff;
  font-size:17px;
  font-weight:bold
}
</style>
</head>

<body>

<h1>🎲 DRH LUDO</h1>

<div>Turn: <b id="turn">You 🔴</b></div>
<div id="status">Roll the dice to start!</div>

<div id="dice" class="dice">
  <div class="dot"></div>
</div>

<div>Dice: <b id="number">-</b></div>

<button id="roll" onclick="rollDice()">Roll Dice</button>

<div id="board" class="board"></div>

<script>

/* Traditional 52-cell outer path */
const path=[
[6,1],[6,2],[6,3],[6,4],[6,5],
[5,6],[4,6],[3,6],[2,6],[1,6],[0,6],
[0,7],[0,8],
[1,8],[2,8],[3,8],[4,8],[5,8],
[6,9],[6,10],[6,11],[6,12],[6,13],[6,14],
[7,14],[8,14],
[8,13],[8,12],[8,11],[8,10],[8,9],
[9,8],[10,8],[11,8],[12,8],[13,8],[14,8],
[14,7],[14,6],
[13,6],[12,6],[11,6],[10,6],[9,6],
[8,5],[8,4],[8,3],[8,2],[8,1],[8,0],
[7,0],[6,0]
];

const safe=[0,8,13,21,26,34,39,47];

const homes={
 red:[[1,1],[1,3],[3,1],[3,3]],
 green:[[1,11],[1,13],[3,11],[3,13]],
 yellow:[[11,1],[11,3],[13,1],[13,3]],
 blue:[[11,11],[11,13],[13,11],[13,13]]
};

/* Each player's starting point */
const start={
 red:0,
 green:13,
 yellow:26,
 blue:39
};

const colors=["red","green","yellow","blue"];

let tokens={
 red:[-1,-1,-1,-1],
 green:[-1,-1,-1,-1],
 yellow:[-1,-1,-1,-1],
 blue:[-1,-1,-1,-1]
};

let turn="red";
let dice=0;
let gameOver=false;


/* CREATE BOARD */

function createBoard(){

 const board=document.getElementById("board");
 board.innerHTML="";

 for(let r=0;r<15;r++){

  for(let c=0;c<15;c++){

   const cell=document.createElement("div");
   cell.className="cell";

   /* Four Home Areas */

   if(r<6 && c<6)
    cell.classList.add("redHome");

   if(r<6 && c>8)
    cell.classList.add("greenHome");

   if(r>8 && c<6)
    cell.classList.add("yellowHome");

   if(r>8 && c>8)
    cell.classList.add("blueHome");

   /* Main path */

   const p=path.findIndex(x=>x[0]===r&&x[1]===c);

   if(p>=0){

    cell.className="cell path";

    if(safe.includes(p))
     cell.classList.add("safe");

    if(p===0)
     cell.classList.add("redStart");

    if(p===13)
     cell.classList.add("greenStart");

    if(p===26)
     cell.classList.add("yellowStart");

    if(p===39)
     cell.classList.add("blueStart");
   }

   /* Center */

   if(r>=6&&r<=8&&c>=6&&c<=8)
    cell.className="cell center";

   cell.id=`cell-${r}-${c}`;

   board.appendChild(cell);
  }
 }

 render();
}


/* SHOW TOKENS */

function render(){

 document.querySelectorAll(".token")
 .forEach(x=>x.remove());

 colors.forEach(color=>{

  tokens[color].forEach((pos,i)=>{

   let cell;

   if(pos===-1){

    const h=homes[color][i];

    cell=document.getElementById(
      `cell-${h[0]}-${h[1]}`
    );

   }else{

    const index=
      (start[color]+pos)%52;

    const p=path[index];

    cell=document.getElementById(
      `cell-${p[0]}-${p[1]}`
    );
   }

   if(cell){

    const token=document.createElement("div");

    token.className=`token ${color}`;

    if(color==="red"&&turn==="red")
     token.onclick=()=>selectToken(i);

    cell.appendChild(token);
   }

  });

 });

}


/* DICE */

function rollDice(){

 if(gameOver)return;

 if(turn!=="red"){
  document.getElementById("status").innerText=
   "Computer is playing...";
  return;
 }

 document.getElementById("roll").disabled=true;

 const d=document.getElementById("dice");

 d.classList.remove("rolling");
 void d.offsetWidth;
 d.classList.add("rolling");

 dice=Math.floor(Math.random()*6)+1;

 document.getElementById("number").innerText=dice;

 setTimeout(()=>{

  showDice(dice);

  document.getElementById("status").innerText=
   dice===6
   ?"6 आया! लाल गोटी चुनें."
   :"चलने वाली लाल गोटी चुनें.";

  highlight();

 },700);
}


/* DICE FACE */

function showDice(n){

 const d=document.getElementById("dice");
 d.innerHTML="";

 const map={
  1:[5],
  2:[1,9],
  3:[1,5,9],
  4:[1,3,7,9],
  5:[1,3,5,7,9],
  6:[1,3,4,6,7,9]
 };

 map[n].forEach(x=>{

  const dot=document.createElement("div");
  dot.className="dot";

  const row=Math.ceil(x/3);
  const col=(x-1)%3+1;

  dot.style.gridRow=row;
  dot.style.gridColumn=col;

  d.appendChild(dot);
 });
}


/* HIGHLIGHT */

function highlight(){

 document.querySelectorAll(".token")
 .forEach(x=>x.classList.remove("selected"));

 tokens.red.forEach((pos,i)=>{

  if(canMove("red",i)){

   const list=
    document.querySelectorAll(".token.red");

   if(list[i])
    list[i].classList.add("selected");
  }
 });
}


/* SELECT TOKEN */

function selectToken(i){

 if(turn!=="red")return;

 if(!canMove("red",i)){

  document.getElementById("status").innerText=
   "इस गोटी को अभी नहीं चला सकते।";

  return;
 }

 move("red",i,dice);
}


/* MOVE CHECK */

function canMove(color,i){

 const pos=tokens[color][i];

 if(pos===56)return false;

 if(pos===-1)
  return dice===6;

 return pos+dice<=56;
}


/* MOVE */

function move(color,i,steps){

 let pos=tokens[color][i];

 if(pos===-1)
  pos=0;
 else
  pos+=steps;

 tokens[color][i]=pos;

 capture(color,i);

 render();

 if(win(color)){

  gameOver=true;

  document.getElementById("status").innerText=
   color==="red"
   ?"🏆 आप जीत गए!"
   :"🤖 Computer जीत गया!";

  return;
 }

 if(steps===6){

  if(color==="red"){

   turn="red";

   document.getElementById("turn").innerText=
    "You 🔴";

   document.getElementById("status").innerText=
    "6 आया! फिर से Dice Roll करें.";

   document.getElementById("roll").disabled=false;

  }

  return;
 }

 if(color==="red"){

  turn="green";

  document.getElementById("turn").innerText=
   "Computer 🟢";

  document.getElementById("status").innerText=
   "Computer की बारी...";

  setTimeout(computer,1000);

 }else{

  turn="red";

  document.getElementById("turn").innerText=
   "You 🔴";

  document.getElementById("status").innerText=
   "आपकी बारी! Dice Roll करें.";

  document.getElementById("roll").disabled=false;
 }
}


/* CAPTURE */

function capture(color,i){

 const pos=tokens[color][i];

 if(pos<0)return;

 const current=
  (start[color]+pos)%52;

 if(safe.includes(current))
  return;

 colors.forEach(other=>{

  if(other===color)return;

  tokens[other].forEach((p,j)=>{

   if(p<0)return;

   const otherPos=
    (start[other]+p)%52;

   if(otherPos===current)
    tokens[other][j]=-1;

  });
 });
}


/* WIN */

function win(color){

 return tokens[color]
 .every(x=>x===56);
}


/* COMPUTER */

function computer(){

 if(gameOver)return;

 dice=
  Math.floor(Math.random()*6)+1;

 document.getElementById("number").innerText=dice;

 showDice(dice);

 document.getElementById("status").innerText=
  "Computer ने "+dice+" roll किया.";

 let moves=[];

 tokens.green.forEach((p,i)=>{

  if(canMove("green",i))
   moves.push(i);

 });

 if(moves.length===0){

  if(dice===6){

   setTimeout(()=>{

    turn="red";

    document.getElementById("turn").innerText=
     "You 🔴";

    document.getElementById("status").innerText=
     "Computer नहीं चल सका। फिर आपकी बारी!";

    document.getElementById("roll").disabled=false;

   },700);

  }else{

   setTimeout(()=>{

    turn="red";

    document.getElementById("turn").innerText=
     "You 🔴";

    document.getElementById("status").innerText=
     "आपकी बारी! Dice Roll करें.";

    document.getElementById("roll").disabled=false;

   },700);
  }

  return;
 }

 const selected=
  moves[Math.floor(Math.random()*moves.length)];

 setTimeout(()=>{

  move("green",selected,dice);

 },800);
}


/* START */

createBoard();
showDice(1);

</script>

</body>
</html>
