<!DOCTYPE html>
<html>
<head>
  <title>DRH LUDO</title>

  <style>
    body {
      text-align: center;
      font-family: Arial, sans-serif;
      background: #222;
      color: white;
    }

    h1 {
      color: #ffd700;
    }

    .dice {
      font-size: 100px;
      display: inline-block;
    }

    .roll {
      animation: rotateDice 0.7s;
    }

    @keyframes rotateDice {
      0% {
        transform: rotate(0deg);
      }

      25% {
        transform: rotate(90deg);
      }

      50% {
        transform: rotate(180deg);
      }

      75% {
        transform: rotate(270deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    button {
      padding: 15px 30px;
      font-size: 20px;
      border-radius: 10px;
      cursor: pointer;
    }

    #number {
      font-size: 30px;
      color: #00ff00;
    }
  </style>
</head>

<body>

  <h1>🎲 DRH LUDO</h1>

  <div id="dice" class="dice">⚀</div>

  <br><br>

  <button onclick="rollDice()">Roll Dice</button>

  <h2>
    Dice: <span id="number">-</span>
  </h2>

  <script>

    function rollDice() {

      let dice = document.getElementById("dice");
      let number = document.getElementById("number");

      // Animation restart
      dice.classList.remove("roll");
      void dice.offsetWidth;
      dice.classList.add("roll");

      // Random number 1 to 6
      let value = Math.floor(Math.random() * 6) + 1;

      // Dice picture according to number
      let diceFaces = ["⚀", "⚁", "⚂", "⚃", "⚄", "⚅"];

      // Show number
      number.innerHTML = value;

      // Show matching dice face
      dice.innerHTML = diceFaces[value - 1];

    }

  </script>

</body>
</html>
