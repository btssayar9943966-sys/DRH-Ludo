<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>DRH LUDO</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: #222;
      color: white;
    }

    .game {
      text-align: center;
    }

    h1 {
      color: #ffd700;
      font-size: 36px;
    }

    /* Dice */
    .dice {
      width: 110px;
      height: 110px;
      margin: 20px auto;
      background: white;
      border-radius: 18px;
      padding: 12px;
      box-sizing: border-box;

      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);

      gap: 5px;

      box-shadow: 0 8px 20px rgba(0,0,0,0.5);
    }

    .dot {
      width: 22px;
      height: 22px;
      background: #111;
      border-radius: 50%;
      align-self: center;
      justify-self: center;
    }

    /* Dice घूमने की animation */
    .rolling {
      animation: diceRoll 0.8s ease-in-out;
    }

    @keyframes diceRoll {
      0% {
        transform: rotate(0deg) scale(1);
      }

      25% {
        transform: rotate(90deg) scale(1.1);
      }

      50% {
        transform: rotate(180deg) scale(1.15);
      }

      75% {
        transform: rotate(270deg) scale(1.1);
      }

      100% {
        transform: rotate(360deg) scale(1);
      }
    }

    button {
      background: #ff9800;
      color: white;
      border: none;
      padding: 15px 35px;
      font-size: 20px;
      font-weight: bold;
      border-radius: 12px;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.95);
    }

    #number {
      color: #00ff00;
      font-size: 32px;
    }
  </style>
</head>

<body>

  <div class="game">

    <h1>🎲 DRH LUDO</h1>

    <div id="dice" class="dice">
      <div class="dot"></div>
    </div>

    <button onclick="rollDice()">Roll Dice</button>

    <h2>
      Dice: <span id="number">-</span>
    </h2>

  </div>


  <script>

    const dice = document.getElementById("dice");
    const number = document.getElementById("number");

    function showDice(value) {

      dice.innerHTML = "";

      // Dice पर dots की positions
      const positions = {

        1: [5],

        2: [1, 9],

        3: [1, 5, 9],

        4: [1, 3, 7, 9],

        5: [1, 3, 5, 7, 9],

        6: [1, 3, 4, 6, 7, 9]

      };

      positions[value].forEach(position => {

        const dot = document.createElement("div");

        dot.className = "dot";

        dot.style.gridArea =
          Math.ceil(position / 3) + " / " +
          ((position - 1) % 3 + 1);

        dice.appendChild(dot);

      });

    }


    function rollDice() {

      // Animation शुरू
      dice.classList.remove("rolling");

      // Animation restart
      void dice.offsetWidth;

      dice.classList.add("rolling");


      // Random number 1 से 6
      const value = Math.floor(Math.random() * 6) + 1;


      // Number दिखाएँ
      number.innerText = value;


      // 0.8 सेकंड बाद सही dice face दिखाएँ
      setTimeout(() => {

        showDice(value);

      }, 800);

    }

  </script>

</body>
</html>
